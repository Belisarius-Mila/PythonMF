name: Samantha Daily 3 AM

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. During Prague summer time this starts at 03:00.
    # The Python task still checks the 03:00-08:00 Prague window as a safety gate.
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  daily-3am:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Samantha_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt edge-tts

      - name: Run scheduled daily routine
        if: github.event_name == 'schedule'
        run: python scripts/daily_3am.py --window-start-hour 3 --window-hours 5

      - name: Run manual daily routine
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/daily_3am.py

      - name: Commit generated ColorsAndNumbers audio
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            "ColorsAndNumbers/web_colors_numbers/app.js"
            "docs/colors-numbers/app.js"
            ColorsAndNumbers/web_colors_numbers/owl_*.mp3
            docs/colors-numbers/owl_*.mp3
          )
          existing=()
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              existing+=("$file")
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "No generated ColorsAndNumbers files exist."
            exit 0
          fi
          git add "${existing[@]}"
          if git diff --cached --quiet; then
            echo "No generated ColorsAndNumbers changes to commit."
          else
            git commit -m "Update ColorsAndNumbers owl audio"
            git push
          fi
