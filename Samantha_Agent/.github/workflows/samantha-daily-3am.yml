name: Samantha Daily 3 AM

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This one-off retry is 18:20 Prague summer time
    # for 2026-05-23, inside the accepted 17:00-22:00 Prague window.
    - cron: "20 16 * * *"

permissions:
  contents: write

jobs:
  daily-3am:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Samantha_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt edge-tts

      - name: Run scheduled daily routine
        if: github.event_name == 'schedule'
        run: python scripts/daily_3am.py --window-start-hour 17 --window-hours 5

      - name: Run manual daily routine
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/daily_3am.py

      - name: Commit generated ColorsAndNumbers audio
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            "ColorsAndNumbers/web_colors_numbers/app.js"
            "ColorsAndNumbers/web_colors_numbers/owl_230526.mp3"
          )
          existing=()
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              existing+=("$file")
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "No generated ColorsAndNumbers files exist."
            exit 0
          fi
          git add "${existing[@]}"
          if git diff --cached --quiet; then
            echo "No generated ColorsAndNumbers changes to commit."
          else
            git commit -m "Update ColorsAndNumbers owl audio"
            git push
          fi
