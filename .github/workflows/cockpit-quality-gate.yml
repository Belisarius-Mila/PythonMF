name: Cockpit Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cockpit-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # git_runtime resolves Git through xcrun, rather than the Homebrew PATH.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: Samantha_Agent

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Samantha_Agent/requirements.txt
            Samantha_Agent/camino/server/requirements.txt

      - name: Verify selected Git supports incoming attributes
        run: |
          selected_git="$(/usr/bin/xcrun --find git)"
          "$selected_git" --version
          "$selected_git" --attr-source=HEAD diff --check HEAD HEAD

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r camino/server/requirements.txt

      - name: Run domain checks or daily full regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validation_ci.py
