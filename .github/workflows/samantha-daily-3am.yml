name: Samantha Daily 3 AM

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. During Prague summer time this starts at 03:00.
    # GitHub may start late. Publish the actual Prague day, never a timed no-op.
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Samantha_Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt edge-tts

      - name: Generate and verify today's owl before publication
        run: python scripts/daily_3am.py --publish-owl

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site without changing main
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
