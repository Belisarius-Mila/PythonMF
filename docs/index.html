<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MMTX Web</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles_intro_v2.css?v=20261111friends2">
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-card">
        <div class="story-stage" id="storyStage">
          <img class="story-image" id="sceneImage" src="intro1.png?v=20260402b" alt="Benziho pribeh">
          <div class="stage-vignette"></div>
          <img class="click-prompt" id="clickPrompt" src="ClickMAT.PNG?v=20260402b" alt="Klikni">
          <button class="magnifier-button hidden" id="magnifierButton" type="button" aria-label="Lupa">
            <span class="magnifier-icon">🔍</span>
          </button>
          <button class="mushroom-portal hidden" id="mushroomPortalButton" type="button" aria-label="Houby a barvy">
            <span class="mushroom-portal-icon">🍄</span>
            <span class="mushroom-portal-dots">
              <span class="portal-dot portal-red"></span>
              <span class="portal-dot portal-blue"></span>
              <span class="portal-dot portal-green"></span>
              <span class="portal-dot portal-orange"></span>
            </span>
          </button>
          <button class="bunny-portal hidden" id="bunnyPortalButton" type="button" aria-label="Přátelé" aria-haspopup="dialog" aria-controls="friendsDialog">
            <span class="bunny-portal-icon">🐰</span>
            <span class="bunny-portal-label">Friends</span>
          </button>
          <button class="forest-school-portal hidden" id="forestSchoolPortalButton" type="button" aria-label="ForestSchool">
            <span class="forest-school-portal-icon">🦉</span>
            <span class="forest-school-portal-tree">🌲</span>
            <span class="forest-school-portal-label">ForestSchool</span>
          </button>
          <button class="forest-journey-portal hidden" id="forestJourneyPortalButton" type="button" aria-label="Cesta k jezeru" aria-haspopup="dialog" aria-controls="forestJourneyDialog">
            <span class="forest-journey-portal-icon">🌲</span>
            <span class="forest-journey-portal-path">➜</span>
            <span class="forest-journey-portal-label">Lake</span>
          </button>
          <button class="kate-birthday-portal hidden" id="kateBirthdayPortalButton" type="button" aria-label="Kate birthday">
            <span class="kate-birthday-portal-icon">🎂</span>
            <span class="kate-birthday-portal-spark">✨</span>
            <span class="kate-birthday-portal-label">Kate<br>birthday</span>
          </button>
          <button class="jane-birthday-portal hidden" id="janeBirthdayPortalButton" type="button" aria-label="Jane birthday">
            <span class="jane-birthday-portal-icon">🎂</span>
            <span class="jane-birthday-portal-spark">✨</span>
            <span class="jane-birthday-portal-label">Jane<br>birthday</span>
          </button>
          <button class="adult-quick-skip" id="adultQuickSkipButton" type="button" aria-label="Rychlý posun scény"></button>
          <div class="mushroom-hud hidden" id="mushroomHud">
            <button class="hud-button" id="backToSignpostButton" type="button" aria-label="Zpet">↩</button>
            <button class="hud-button" id="mushroomHelpButton" type="button" aria-label="Napoveda">🔊</button>
            <button class="hud-button active" id="colorsModeButton" type="button" aria-label="Barvy">🎨</button>
            <button class="hud-button" id="numbersModeButton" type="button" aria-label="Cisla">123</button>
          </div>
          <div class="dialogue-hud hidden" id="dialogueHud">
            <button class="hud-button" id="backFromDialogueButton" type="button" aria-label="Zpet">↩</button>
            <button class="hud-button dialogue-door hidden" id="dialogueDoorButton" type="button" aria-label="Dvere">🚪</button>
            <button class="hud-button pulse-soft" id="dialogueHelpButton" type="button" aria-label="Napoveda">🎤</button>
          </div>
          <div class="owl-garden-hud hidden" id="owlGardenHud">
            <button class="hud-button" id="backFromOwlGardenButton" type="button" aria-label="Zpet">↩</button>
            <button class="hud-button hidden" id="owlGardenDoorButton" type="button" aria-label="Dvere">🚪</button>
            <button class="hud-button forest-school-map-button hidden" id="forestSchoolMapButton" type="button" aria-label="Mapa lekci">🗺</button>
            <button class="hud-button pulse-soft" id="owlGardenHelpButton" type="button" aria-label="Napoveda">🎤</button>
          </div>
          <div class="scene-overlay hidden" id="mushroomOverlay"></div>
          <div class="dialogue-panel hidden" id="dialoguePanel"></div>
          <div class="owl-garden-overlay hidden" id="owlGardenOverlay"></div>
          <div class="owl-garden-prompt hidden" id="owlGardenPrompt" aria-hidden="true"></div>
          <button class="owl-garden-thumb hidden" id="owlGardenThumbButton" type="button" aria-label="Palec nahoru">
            👍
          </button>
          <div class="owl-garden-done hidden" id="owlGardenDoneBadge" aria-hidden="true">✓</div>
        </div>
      </section>
      <dialog class="journey-dialog" id="friendsDialog" aria-labelledby="friendsTitle">
        <form method="dialog" class="journey-dialog-heading">
          <h1 id="friendsTitle">Přátelé</h1>
          <button class="journey-close" aria-label="Zavřít výběr Přátel" autofocus>×</button>
        </form>
        <p>Vyber scénu</p>
        <nav class="journey-scenes friends-scenes" id="friendsScenes" aria-label="Scény Přátel">
          <button type="button" data-friends-scene="1" aria-label="Scéna 1 – Benji a Bunny" title="Benji a Bunny">1</button>
          <button type="button" data-friends-scene="2" aria-label="Scéna 2 – Počítání se sovou" title="Počítání se sovou">2</button>
          <button type="button" data-friends-scene="3" aria-label="Scéna 3 – Rozhovor u sovy" title="Rozhovor u sovy">3</button>
          <button type="button" data-friends-scene="4" aria-label="Scéna 4 – Hra s barvami" title="Hra s barvami">4</button>
        </nav>
      </dialog>
      <dialog class="journey-dialog" id="forestJourneyDialog" aria-labelledby="forestJourneyTitle">
        <form method="dialog" class="journey-dialog-heading">
          <h1 id="forestJourneyTitle">Cesta k jezeru</h1>
          <button class="journey-close" aria-label="Zavřít výběr scén" autofocus>×</button>
        </form>
        <p>Vyber scénu</p>
        <nav class="journey-scenes" aria-label="Scény Cesty k jezeru">
          <button id="forestJourneySceneOne" type="button" aria-label="Scéna 1">1</button>
          <a href="scene02_sunnys_lost_nuts/index.html" aria-label="Scéna 2">2</a>
          <a href="scene03_journey_to_the_lake/index.html" aria-label="Scéna 3">3</a>
          <a href="scene04_harry_guard_prototype/index.html" aria-label="Scéna 4">4</a>
          <a href="scene05_log_bridge/index.html" aria-label="Scéna 5">5</a>
          <a href="scene06_lake_arrival/index.html" aria-label="Scéna 6">6</a>
        </nav>
      </dialog>
    </main>

    <script src="scene01_audio_manifest.js?v=20260829fixed1"></script>
    <script src="forest_school_audio_manifest.js?v=20260830fixed1"></script>
    <script src="script_intro_v2.js?v=20261111friends2"></script>
  </body>
</html>
